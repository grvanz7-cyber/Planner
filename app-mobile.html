<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<title>Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#252525;--muted:#777;--accent:#7fa58a;--line:#0001}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{height:100%;display:flex;flex-direction:column}.top{padding:18px 18px 10px}.titleRow{display:flex;align-items:center;justify-content:space-between}.title{font-size:27px;font-weight:750}.date{margin-top:3px;color:var(--muted);font-size:14px}.add{width:42px;height:42px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:26px}
#content{flex:1;overflow:auto;padding:8px 14px 18px;-webkit-overflow-scrolling:touch}.greeting{padding:8px 4px 14px}.greeting h1{margin:0;font-size:22px}.greeting p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.head h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted)}
.task{display:flex;gap:11px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0;padding-top:0}.check{width:22px;height:22px;border:1.5px solid #999;border-radius:7px;flex:none}.taskName{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.taskMeta{font-size:12px;color:var(--muted);margin-top:2px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:8px 0}.quick{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.quick:first-child{border-top:0}.quickIcon{font-size:22px}.quickMain{flex:1}.quickTitle{font-size:14px;font-weight:650}.quickSub{font-size:12px;color:var(--muted);margin-top:2px}.pill{font-size:11px;background:#eef3ed;padding:5px 8px;border-radius:9px;color:#526457}
.bottom{display:flex;min-height:68px;padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}.bottom button{flex:1;border:0;background:transparent;border-radius:13px;font-size:11px;color:inherit}.bottom button span{display:block;font-size:21px;margin-bottom:2px}.bottom button.active{background:#00000009;font-weight:700}
</style></head>
<body><div id="app"><header class="top"><div class="titleRow"><div><div class="title">Planner</div><div class="date" id="date"></div></div><button class="add" aria-label="Add">+</button></div></header><main id="content"><div class="greeting"><h1 id="greeting"></h1><p>Here's what's on your plate today.</p></div><section class="card"><div class="head"><h2>Today</h2><span class="count" id="todayCount">0 tasks</span></div><div id="todayList"></div></section><section class="card"><div class="head"><h2>Upcoming</h2><span class="count" id="upcomingCount">0</span></div><div id="upcomingList"></div></section><section class="card"><div class="head"><h2>Quick access</h2></div><div class="quick"><div class="quickIcon">📚</div><div class="quickMain"><div class="quickTitle">School</div><div class="quickSub">Subjects & assignments</div></div><span class="pill">Open</span></div><div class="quick"><div class="quickIcon">⏱️</div><div class="quickMain"><div class="quickTitle">Focus</div><div class="quickSub">Start a study session</div></div><span class="pill">Soon</span></div></section></main><nav class="bottom"><button class="active"><span>🏠</span>Today</button><button><span>📅</span>Calendar</button><button><span>✓</span>Tasks</button><button><span>📚</span>School</button><button><span>☰</span>More</button></nav></div>
<script src="app-data.js"></script><script>
(function(){const n=new Date();document.getElementById('date').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});document.getElementById('greeting').textContent=n.getHours()<12?'Good morning!':n.getHours()<18?'Good afternoon!':'Good evening!';const tasks=window.PlannerAppData.getTasks();const start=new Date();start.setHours(0,0,0,0);function day(v){if(!v)return null;const d=new Date(v+'T00:00:00');d.setHours(0,0,0,0);return d}function safe(v){return String(v||'Untitled').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const today=tasks.filter(t=>{const d=day(t.dueDate);return d&&d.getTime()===start.getTime()&&!t.completed});const upcoming=tasks.filter(t=>{const d=day(t.dueDate);return d&&d>start&&!t.completed}).sort((a,b)=>day(a.dueDate)-day(b.dueDate));document.getElementById('todayCount').textContent=today.length+' task'+(today.length===1?'':'s');document.getElementById('upcomingCount').textContent=upcoming.length;document.getElementById('todayList').innerHTML=today.length?today.map(t=>`<div class="task"><div class="check"></div><div><div class="taskName">${safe(t.name)}</div><div class="taskMeta">${safe(t.type||'Task')}${t.subject?' · '+safe(t.subject):''}</div></div></div>`).join(''):'<div class="empty">Nothing scheduled for today.</div>';document.getElementById('upcomingList').innerHTML=upcoming.length?upcoming.slice(0,5).map(t=>`<div class="task"><div class="check"></div><div><div class="taskName">${safe(t.name)}</div><div class="taskMeta">${safe(t.dueDate)}${t.type?' · '+safe(t.type):''}</div></div></div>`).join(''):'<div class="empty">Nothing coming up.</div>'})();
</script></body></html>
