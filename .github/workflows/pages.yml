name: Deploy Planner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout desktop Planner
        uses: actions/checkout@v4

      - name: Download mobile app from app-development
        run: |
          mkdir -p .mobile-source
          git clone --depth 1 --branch app-development https://github.com/${{ github.repository }}.git .mobile-source
          cp .mobile-source/app-shell.html ./app-shell.html
          cp .mobile-source/manifest.webmanifest ./manifest.webmanifest
          cp .mobile-source/service-worker.js ./service-worker.js
          cp .mobile-source/planner-icon.svg ./planner-icon.svg
          cp .mobile-source/app-*.js ./
          rm -rf .mobile-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
