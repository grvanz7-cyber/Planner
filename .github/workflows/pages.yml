name: Deploy Planner

on:
  push:
    branches: [app-development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout desktop Planner
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Overlay mobile app into isolated path
        run: |
          git clone --depth 1 --branch app-development https://github.com/${{ github.repository }}.git .mobile-source
          mkdir -p mobile
          cp .mobile-source/app-shell.html ./mobile/app-shell.html
          cp .mobile-source/manifest.webmanifest ./mobile/manifest.webmanifest
          cp .mobile-source/service-worker.js ./mobile/service-worker.js
          cp .mobile-source/planner-icon.svg ./mobile/planner-icon.svg
          cp .mobile-source/app-*.js ./mobile/
          rm -rf .mobile-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
