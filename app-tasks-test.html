<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><title>Planner Tasks</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#252525;--muted:#777;--accent:#7fa58a;--line:#00000010}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{height:100%;display:flex;flex-direction:column}.top{padding:18px}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;color:var(--muted);margin-top:3px}.content{flex:1;overflow:auto;padding:4px 14px 18px}.card{background:var(--card);border-radius:18px;padding:17px;box-shadow:0 2px 10px #0000000d}.taskFilters{display:flex;gap:8px;margin-bottom:14px}.taskFilters button{flex:1;border:0;border-radius:11px;padding:10px;background:#00000008}.taskFilters button.selected{background:var(--accent);color:#fff;font-weight:650}.taskList{display:flex;flex-direction:column}.taskRow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px}.taskCheck{width:23px;height:23px;border:1.5px solid #999;border-radius:7px;display:grid;place-items:center;flex:none}.taskInfo{display:flex;flex-direction:column;min-width:0}.taskInfo strong{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.taskInfo small{font-size:12px;color:var(--muted);margin-top:2px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:16px}.sheetBackdrop{position:fixed;inset:0;background:#0005;display:flex;align-items:flex-end;z-index:20}.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));position:relative}.sheetClose{position:absolute;right:14px;top:10px;border:0;background:none;font-size:28px}.sheet h2{margin:4px 35px 12px 0}.sheet p{color:var(--muted);margin:6px 0}.sheetAction{margin-top:16px;width:100%;border:0;border-radius:13px;padding:13px;background:var(--accent);color:#fff;font-weight:650}.bottom{display:flex;min-height:68px;padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}.bottom button{flex:1;border:0;background:transparent;border-radius:13px;font-size:11px}.bottom span{display:block;font-size:21px;margin-bottom:2px}
</style></head>
<body><div id="app"><header class="top"><div class="title">Tasks</div><div class="subtitle">Everything you still need to do.</div></header><main class="content"><section class="card" id="tasks"></section></main><nav class="bottom"><button><span>🏠</span>Today</button><button><span>📅</span>Calendar</button><button><span>✓</span>Tasks</button><button><span>📚</span>School</button><button><span>☰</span>More</button></nav></div><script src="app-data.js"></script><script src="app-tasks.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(window.PlannerAppTasks)window.PlannerAppTasks.render(document.getElementById('tasks'));});</script></body></html>
