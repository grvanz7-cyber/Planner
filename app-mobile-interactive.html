<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><title>Planner</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--bg:#f7f7f4;--card:#fff;--text:#252525;--muted:#777;--accent:#7fa58a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui;color:var(--text)}body{padding-top:env(safe-area-inset-top)}#app{height:100%;display:flex;flex-direction:column}.top{padding:18px}.title{font-size:27px;font-weight:750}.date{color:var(--muted);font-size:14px}.content{flex:1;overflow:auto;padding:0 14px 18px}.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.head{display:flex;justify-content:space-between}.count{font-size:12px;color:#777}.task{display:flex;gap:10px;padding:12px 0;border-top:1px solid #0001;cursor:pointer}.task:first-child{border:0}.check{width:22px;height:22px;border:1px solid #999;border-radius:7px;background:#fff}.name{font-size:14px;font-weight:600}.meta{font-size:12px;color:#777}.add{position:fixed;right:18px;bottom:82px;width:50px;height:50px;border:0;border-radius:17px;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 4px 12px #0002}.bottom{display:flex;min-height:68px;padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #0001}.bottom button{flex:1;border:0;background:transparent;font-size:11px}.bottom span{display:block;font-size:21px}.overlay{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end}.sheet{background:#fff;width:100%;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}.field{width:100%;padding:12px;border:1px solid #0002;border-radius:12px;margin:5px 0}.actions{display:flex;gap:10px;margin-top:8px}.actions button{flex:1;padding:12px;border:0;border-radius:12px}.primary{background:var(--accent);color:#fff}</style></head><body><div id="app"><header class="top"><div class="title">Planner</div><div class="date" id="date"></div></header><main class="content"><div style="padding:0 4px 14px"><h2 id="greeting" style="margin:0"></h2><div style="color:#777;font-size:14px">Here's what's on your plate today.</div></div><section class="card"><div class="head"><h3 style="margin:0">Today</h3><span class="count" id="todayCount"></span></div><div id="today"></div></section><section class="card"><div class="head"><h3 style="margin:0">Upcoming</h3><span class="count" id="upCount"></span></div><div id="upcoming"></div></section></main><button class="add" id="add">+</button><nav class="bottom"><button><span>🏠</span>Today</button><button><span>📅</span>Calendar</button><button><span>✓</span>Tasks</button><button><span>📚</span>School</button><button><span>☰</span>More</button></nav></div><div class="overlay" id="overlay"><div class="sheet"><h2 id="sheetTitle">New task</h2><input class="field" id="name" placeholder="Task name"><input class="field" id="due" type="date"><div class="actions"><button id="cancel">Cancel</button><button class="primary" id="save">Add task</button></div></div></div><script src="app-data.js"></script><script>(function(){let tasks=PlannerAppData.getTasks();const now=new Date();const today=new Date(now);today.setHours(0,0,0,0);document.getElementById('date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});document.getElementById('greeting').textContent=now.getHours()<12?'Good morning!':now.getHours()<18?'Good afternoon!':'Good evening!';const day=v=>v?new Date(v+'T00:00:00'):null;const esc=v=>String(v||'Untitled').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function render(){tasks=PlannerAppData.refresh();const td=tasks.filter(t=>{const d=day(t.dueDate);return d&&d.getTime()===today.getTime()&&!t.completed});const up=tasks.filter(t=>{const d=day(t.dueDate);return d&&d>today&&!t.completed}).sort((a,b)=>day(a.dueDate)-day(b.dueDate));document.getElementById('todayCount').textContent=td.length+' task'+(td.length===1?'':'s');document.getElementById('upCount').textContent=up.length;const row=t=>'<div class="task" data-id="'+esc(t.id||t.ID)+'"><button class="check" aria-label="Complete"></button><div><div class="name">'+esc(t.name)+'</div><div class="meta">'+esc(t.type||'Task')+(t.subject?' · '+esc(t.subject):'')+(t.dueDate?' · '+esc(t.dueDate):'')+'</div></div></div>';document.getElementById('today').innerHTML=td.length?td.map(row).join(''):'<div style="color:#777;text-align:center;padding:8px">Nothing scheduled for today.</div>';document.getElementById('upcoming').innerHTML=up.length?up.slice(0,5).map(row).join(''):'<div style="color:#777;text-align:center;padding:8px">Nothing coming up.</div>';document.querySelectorAll('.task').forEach(el=>el.onclick=()=>openEdit(el.dataset.id));document.querySelectorAll('.check').forEach(b=>b.onclick=e=>{e.stopPropagation();const el=b.parentElement;const t=tasks.find(x=>String(x.id||x.ID)===String(el.dataset.id));if(t){t.completed=true;saveData();render()}})}function saveData(){localStorage.setItem('plannerData',JSON.stringify({tasks:tasks,settings:{}}))}let editing=null;function openEdit(id){editing=tasks.find(t=>String(t.id||t.ID)===String(id));if(!editing)return;document.getElementById('sheetTitle').textContent='Edit task';document.getElementById('name').value=editing.name||'';document.getElementById('due').value=editing.dueDate||'';document.getElementById('save').textContent='Save';document.getElementById('overlay').style.display='flex'}document.getElementById('add').onclick=()=>{editing=null;document.getElementById('sheetTitle').textContent='New task';document.getElementById('name').value='';document.getElementById('due').value=now.toISOString().slice(0,10);document.getElementById('save').textContent='Add task';document.getElementById('overlay').style.display='flex'};document.getElementById('cancel').onclick=()=>document.getElementById('overlay').style.display='none';document.getElementById('save').onclick=()=>{const n=document.getElementById('name').value.trim();if(!n)return;if(editing){editing.name=n;editing.dueDate=document.getElementById('due').value}else tasks.push({id:'M-'+Date.now(),name:n,dueDate:document.getElementById('due').value,type:'task',completed:false});saveData();document.getElementById('overlay').style.display='none';render()};document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.currentTarget.style.display='none'};render()})();</script></body></html>
