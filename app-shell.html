<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><title>Planner</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--bg:#f7f7f4;--card:#fff;--text:#252525;--muted:#777;--accent:#7fa58a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#app{height:100%;display:flex;flex-direction:column}.top{padding:18px 18px 10px}.title-row{display:flex;align-items:center;justify-content:space-between}.title{font-size:27px;font-weight:750}.date{margin-top:3px;color:var(--muted);font-size:14px}.add{width:42px;height:42px;border:0;border-radius:14px;background:var(--accent);color:white;font-size:26px}#content{flex:1;overflow:auto;padding:8px 14px 18px;-webkit-overflow-scrolling:touch}.greeting{padding:8px 4px 14px}.greeting h1{margin:0;font-size:22px}.greeting p{margin:4px 0 0;color:var(--muted);font-size:14px}.card{background:var(--card);border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.card-head h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);font-size:13px;padding:8px 0}.quick{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #00000010}.quick:first-child{border-top:0}.quick-icon{font-size:22px}.quick-main{flex:1}.quick-title{font-size:14px;font-weight:650}.quick-sub{font-size:12px;color:var(--muted);margin-top:2px}.pill{font-size:11px;background:#eef3ed;padding:5px 8px;border-radius:9px;color:#526457}.bottom{display:flex;min-height:68px;padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid #00000010}.bottom button{flex:1;border:0;background:transparent;border-radius:13px;font-size:11px;color:inherit}.bottom button span{display:block;font-size:21px;margin-bottom:2px}.bottom button.active{background:#00000009;font-weight:700}</style></head>
<body><div id="app"><header class="top"><div class="title-row"><div><div class="title">Planner</div><div class="date" id="date"></div></div><button class="add" aria-label="Add">+</button></div></header><main id="content"><div class="greeting"><h1 id="greeting"></h1><p>Here's what's on your plate today.</p></div><section class="card"><div class="card-head"><h2>Today</h2><span class="count">0 tasks</span></div><div class="empty">Nothing scheduled for today.</div></section><section class="card"><div class="card-head"><h2>Upcoming</h2><span class="count">0</span></div><div class="empty">Nothing coming up.</div></section><section class="card"><div class="card-head"><h2>Quick access</h2></div><div class="quick"><div class="quick-icon">📚</div><div class="quick-main"><div class="quick-title">School</div><div class="quick-sub">Subjects & assignments</div></div><span class="pill">Open</span></div><div class="quick"><div class="quick-icon">⏱️</div><div class="quick-main"><div class="quick-title">Focus</div><div class="quick-sub">Start a study session</div></div><span class="pill">Soon</span></div></section></main><nav class="bottom"><button class="active"><span>🏠</span>Today</button><button><span>📅</span>Calendar</button><button><span>✓</span>Tasks</button><button><span>📚</span>School</button><button><span>☰</span>More</button></nav></div><script>const n=new Date();document.getElementById('date').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});document.getElementById('greeting').textContent=n.getHours()<12?'Good morning!':n.getHours()<18?'Good afternoon!':'Good evening!';</script></body></html>
