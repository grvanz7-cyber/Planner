<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f4"><title>Planner</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--bg:#f7f7f4;--card:#fff;--text:#252525;--muted:#777;--accent:#7fa58a}html[data-theme="dark"]{--bg:#171916;--card:#242722;--text:#f2f3ef;--muted:#aeb2aa}html[data-theme="light"]{--bg:#f7f7f4;--card:#fff;--text:#252525;--muted:#777}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#app{height:100%;display:flex;flex-direction:column}.top{padding:18px 18px 10px}.title-row{display:flex;align-items:center;justify-content:space-between}.title{font-size:27px;font-weight:750}.date{margin-top:3px;color:var(--muted);font-size:14px}.add{width:42px;height:42px;border:0;border-radius:14px;background:var(--accent);color:white;font-size:26px;cursor:pointer}.add:active{transform:scale(.94)}#content{flex:1;overflow:auto;padding:8px 14px 18px;-webkit-overflow-scrolling:touch}.greeting{padding:8px 4px 14px}.greeting h1{margin:0;font-size:22px}.greeting p{margin:4px 0 0;color:var(--muted);font-size:14px}.card{background:var(--card);border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.card-head,.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.card-head h2,.head h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);font-size:13px;padding:8px 0}.quick{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #00000010;cursor:pointer}.quick:first-child{border-top:0}.quick-icon{font-size:22px}.quick-main{flex:1}.quick-title{font-size:14px;font-weight:650}.quick-sub{font-size:12px;color:var(--muted);margin-top:2px}.pill{font-size:11px;background:#eef3ed;padding:5px 8px;border-radius:9px;color:#526457}.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid #00000010}.setting:first-of-type{border-top:0}.setting span{display:flex;flex-direction:column}.setting strong{font-size:14px}.setting small{font-size:12px;color:var(--muted);margin-top:3px}.setting select{border:1px solid #00000018;border-radius:10px;padding:7px 9px;background:var(--bg);color:var(--text)}.bottom{display:flex;min-height:68px;padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid #00000010}.bottom button{flex:1;border:0;background:transparent;border-radius:13px;font-size:11px;color:inherit}.bottom button span{display:block;font-size:21px;margin-bottom:2px}.bottom button.active{background:#00000009;font-weight:700}.compact .card{padding:13px}.compact .quick{padding:9px 0}.add-sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end}.add-backdrop{position:absolute;inset:0;background:#00000055}.add-panel{position:relative;width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:9px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px #00000025;animation:sheetUp .22s ease-out}.add-grab{width:42px;height:5px;border-radius:9px;background:#0003;margin:0 auto 12px}.add-head{display:flex;align-items:center;justify-content:space-between}.add-head h2{margin:0;font-size:20px}.add-close{border:0;background:transparent;color:var(--muted);font-size:30px;line-height:1}.add-type{display:flex;gap:7px;margin:15px 0}.add-type button{flex:1;border:1px solid #00000015;background:var(--bg);color:var(--text);border-radius:11px;padding:10px}.add-type button.selected{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}.add-field{display:block;margin:12px 0}.add-field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.add-field input,.add-field select{width:100%;border:1px solid #00000018;border-radius:12px;padding:12px;background:var(--bg);color:var(--text);font:inherit}.add-save{width:100%;border:0;border-radius:13px;padding:13px;background:var(--accent);color:#fff;font:inherit;font-weight:700;margin-top:7px}@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}.mobile-task{width:100%;display:flex;gap:11px;align-items:center;text-align:left;border:0;background:transparent;color:inherit;padding:9px 0;cursor:pointer}.mobile-check{width:24px;height:24px;flex:0 0 24px;border:2px solid #0002;border-radius:50%;display:grid;place-items:center;font-size:14px}.mobile-task.done .mobile-check{background:var(--accent);border-color:var(--accent);color:#fff}.mobile-task-body{min-width:0;display:flex;flex-direction:column}.mobile-task-body strong{font-size:14px}.mobile-task-body small{font-size:11px;color:var(--muted);margin-top:2px}.mobile-task.done strong{text-decoration:line-through;color:var(--muted)}</style></head>
<body><div id="app"><header class="top"><div class="title-row"><div><div class="title">Planner</div><div class="date" id="date"></div></div><button class="add" id="addButton" aria-label="Add">+</button></div></header><main id="content"></main><nav class="bottom"><button class="active"><span>🏠</span>Today</button><button><span>📅</span>Calendar</button><button><span>✓</span>Tasks</button><button><span>📚</span>School</button><button><span>☰</span>More</button></nav></div><script src="app-data.js"></script><script src="app-navigation.js"></script><script src="app-calendar.js"></script><script src="app-tasks.js"></script><script src="app-school.js"></script><script src="app-settings.js"></script><script src="app-mobile-ui.js"></script><script src="app-add.js"></script><script src="app-entry.js"></script><script>document.getElementById('addButton').addEventListener('click',()=>window.PlannerAppAdd?.open());document.getElementById('date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());</script></body></html>
