<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <title>Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{color-scheme:light;--bg:#f7f7f4;--card:#fff;--text:#252525;--muted:#777;--accent:#7fa58a}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}
    body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    #app{height:100%;display:flex;flex-direction:column}.top{padding:18px 18px 10px}.title{font-size:27px;font-weight:750}.subtitle{margin-top:3px;color:var(--muted);font-size:14px}
    #content{flex:1;overflow:auto;padding:8px 14px 18px;-webkit-overflow-scrolling:touch}.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}
    .bottom{display:flex;min-height:68px;padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid #00000010}.bottom button{flex:1;border:0;background:transparent;border-radius:13px;font:inherit;font-size:11px;color:inherit}.bottom button span{display:block;font-size:21px;margin-bottom:2px}.bottom button.active{background:#00000009;font-weight:700}
    .notice{line-height:1.5;color:var(--muted)}
  </style>
</head>
<body>
<div id="app">
  <header class="top"><div class="title">Planner</div><div class="subtitle">Your little planning space</div></header>
  <main id="content">
    <section class="card"><h2>App shell</h2><p class="notice">This is the isolated mobile app interface. The existing planner remains untouched on <code>main</code>. We can connect this shell to the existing planner systems one at a time.</p></section>
  </main>
  <nav class="bottom" aria-label="Planner navigation">
    <button class="active"><span>🏠</span>Today</button><button><span>📅</span>Calendar</button><button><span>✓</span>Tasks</button><button><span>📚</span>School</button><button><span>☰</span>More</button>
  </nav>
</div>
</body>
</html>
