<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Planner</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- ========================================
         SIDEBAR
         ======================================== -->

    <aside class="sidebar">

        <div class="logo">
            Planner
        </div>


        <div class="nav-section">

            <div class="nav-title">
                Planner
            </div>

            <a
                href="#"
                class="nav-item active"
            >
                🏠 Today
            </a>

            <a
                href="#"
                class="nav-item"
            >
                📅 Calendar
            </a>

            <a
                href="#"
                class="nav-item"
            >
                ✓ Tasks
            </a>

        </div>


        <div class="nav-section">

            <div class="nav-title">
                School
            </div>

            <a
                href="#"
                class="nav-item"
            >
                📚 Subjects
            </a>

            <a
                href="#"
                class="nav-item"
            >
                📝 Assignments
            </a>

            <a
                href="#"
                class="nav-item"
            >
                🧪 Tests & Exams
            </a>

            <a
                href="#"
                class="nav-item"
            >
                📊 Grades
            </a>

        </div>


        <div class="nav-section">

            <div class="nav-title">
                Personal
            </div>

            <a
                href="#"
                class="nav-item"
            >
                🌱 Habits
            </a>

            <a
                href="#"
                class="nav-item"
            >
                🗒 Notes
            </a>

        </div>


        <div class="nav-section">

            <a
                href="#"
                class="nav-item"
            >
                ⚙ Settings
            </a>

        </div>

    </aside>



    <!-- ========================================
         MAIN CONTENT
         ======================================== -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">

            <h1>
                Good afternoon!
            </h1>

            <p>
                Tuesday, August 25
            </p>

        </header>



        <!-- QUICK ADD -->

        <div class="quick-add">

            <input
                type="text"
                placeholder="What do you need to do?"
            >

            <button onclick="openTaskModal()">
                Add
            </button>

        </div>



        <!-- DASHBOARD -->

        <div class="dashboard-grid">


            <!-- TODAY -->

            <section class="card">

                <h2>
                    Today
                </h2>

                <div class="today-tasks"></div>

            </section>



            <!-- UPCOMING -->

            <section class="card">

                <h2>
                    Upcoming
                </h2>

                <div class="upcoming-tasks"></div>

            </section>


        </div>


    </main>

</div>



<!-- ========================================
     NEW TASK MODAL
     ======================================== -->

<div
    class="modal-overlay"
    id="taskModal"
>

    <div class="modal">


        <!-- MODAL HEADER -->

        <div class="modal-header">

            <h2>
                New Task
            </h2>

            <button
                class="close-button"
                onclick="closeTaskModal()"
            >
                ×
            </button>

        </div>



        <!-- TASK NAME -->

        <div class="form-group">

            <label for="taskName">
                Name
            </label>

            <input
                id="taskName"
                type="text"
                placeholder="What do you need to do?"
            >

        </div>



        <!-- SUBJECT + TYPE -->

        <div class="form-row">


            <div class="form-group">

                <label for="taskSubject">
                    Subject
                </label>

                <select id="taskSubject">

                    <option value="">
                        None
                    </option>

                    <option value="English">
                        English
                    </option>

                    <option value="Math">
                        Math
                    </option>

                    <option value="Physics">
                        Physics
                    </option>

                    <option value="Chemistry">
                        Chemistry
                    </option>

                    <option value="Biology">
                        Biology
                    </option>

                </select>

            </div>



            <div class="form-group">

                <label for="taskType">
                    Type
                </label>

                <select id="taskType">

                    <option value="Task">
                        Task
                    </option>

                    <option value="Homework">
                        Homework
                    </option>

                    <option value="Assignment">
                        Assignment
                    </option>

                    <option value="Quiz">
                        Quiz
                    </option>

                    <option value="Test">
                        Test
                    </option>

                    <option value="Exam">
                        Exam
                    </option>

                </select>

            </div>


        </div>



        <!-- DATE + PRIORITY -->

        <div class="form-row">


            <div class="form-group">

                <label for="taskDueDate">
                    Due date
                </label>

                <input
                    id="taskDueDate"
                    type="date"
                >

            </div>



            <div class="form-group">

                <label for="taskPriority">
                    Priority
                </label>

                <select id="taskPriority">

                    <option value="Low">
                        Low
                    </option>

                    <option
                        value="Normal"
                        selected
                    >
                        Normal
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>

            </div>


        </div>



        <!-- TAGS -->

        <div class="form-group">

            <label for="taskTags">
                Tags
            </label>

            <input
                id="taskTags"
                type="text"
                placeholder="#School, #Important"
            >

        </div>



        <!-- BUTTONS -->

        <div class="modal-actions">

            <button
                class="cancel-button"
                onclick="closeTaskModal()"
            >
                Cancel
            </button>

            <button
                class="save-button"
                onclick="createTask()"
            >
                Add Task
            </button>

        </div>


    </div>

</div>



<!-- JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
