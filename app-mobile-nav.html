<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<title>Planner</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#252525;--muted:#777;--accent:#7fa58a;--line:#0001}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{height:100%;display:flex;flex-direction:column}.top{padding:18px 18px 10px}.titleRow{display:flex;align-items:center;justify-content:space-between}.title{font-size:27px;font-weight:750}.date{margin-top:3px;color:var(--muted);font-size:14px}.add{width:42px;height:42px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:26px}
#content{flex:1;overflow:auto;padding:8px 14px 18px;-webkit-overflow-scrolling:touch}.greeting{padding:8px 4px 14px}.greeting h1{margin:0;font-size:22px}.greeting p{margin:4px 0 0;color:var(--muted);font-size:14px}.card{background:var(--card);border-radius:18px;padding:17px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.head h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted)}.task{display:flex;gap:11px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0;padding-top:0}.check{width:22px;height:22px;border:1.5px solid #999;border-radius:7px;flex:none}.taskName{font-size:14px;font-weight:600}.taskMeta{font-size:12px;color:var(--muted);margin-top:2px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:8px 0}.quick{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.quick:first-child{border-top:0}.quickIcon{font-size:22px}.quickMain{flex:1}.quickTitle{font-size:14px;font-weight:650}.quickSub{font-size:12px;color:var(--muted);margin-top:2px}.bottom{display:flex;min-height:68px;padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}.bottom button{flex:1;border:0;background:transparent;border-radius:13px;font-size:11px;color:inherit}.bottom button span{display:block;font-size:21px;margin-bottom:2px}.bottom button.active{background:#00000009;font-weight:700}
</style>
</head>
<body>
<div id="app"><header class="top"><div class="titleRow"><div><div class="title">Planner</div><div class="date" id="date"></div></div><button class="add" id="add">+</button></div></header><main id="content"></main><nav class="bottom" id="nav"><button data-view="today" class="active"><span>🏠</span>Today</button><button data-view="calendar"><span>📅</span>Calendar</button><button data-view="tasks"><span>✓</span>Tasks</button><button data-view="school"><span>📚</span>School</button><button data-view="more"><span>☰</span>More</button></nav></div>
<script src="app-data.js"></script><script src="app-navigation.js"></script><script>
(function(){
 const n=new Date();
 document.getElementById('date').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 document.getElementById('add').addEventListener('click',()=>{ if(window.PlannerAppData&&typeof window.PlannerAppData.addTask==='function') window.PlannerAppData.addTask(); else alert('Task creation will be connected next.'); });
 document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>window.PlannerAppNavigation.render(b.dataset.view)));
 window.PlannerAppNavigation.render('today');
})();
</script></body></html>
